              private static final int[] COLORS = {0xFFFFFF, 0xFF3B30, 0xFFD60A, 0x30D158, 0x4169E1, 0x000000};
              private static final String[] CN = {"Putih", "Merah", "Kuning", "Hijau", "Biru", "Hitam"};

              public GalleryScreen(Screen parent) { super(Text.literal("Gallery")); this.parent = parent; }
              @Override public void renderBackground(DrawContext c, int mx, int my, float d) {}
              @Override public void close() { client.setScreen(parent); }
              @Override public void removed() { Assets.destroy(prev); prev = null; }

              @Override protected void init() {
                  Path dir = FabricLoader.getInstance().getGameDir().resolve("screenshots");
                  files = Assets.list(dir, ".png");
                  Collections.reverse(files);
                  int lw = 170, top = 36;
                  ax = 190; ay = top; aw = width - 200; ah = height - 106 - top;
                  int rows = Math.max(1, (height - 34 - top - 8) / 22);
                  scroll = Math.max(0, Math.min(scroll, Math.max(0, files.size() - rows)));
                  for (int i = 0; i < rows && scroll + i < files.size(); i++) {
                      final Path p = files.get(scroll + i);
                      addDrawableChild(new RoyalButton(14, top + 4 + i * 22, lw - 8, 20, p.getFileName().toString(), b -> {
                          load(p); clearAndInit();
                      }).style(RoyalButton.ROW).left(true).select(p.equals(sel)));
                  }
                  int W2 = aw, y1 = height - 100, y2 = height - 76, y3 = height - 52, y4 = height - 28;
                  String[] fn = {"Gray", "Sepia", "Invert", "Hangat", "Dingin", "Reset"};
                  int bw = (W2 - 5 * 4) / 6;
                  for (int i = 0; i < 6; i++) {
                      final int k = i;
                      addDrawableChild(new RoyalButton(ax + i * (bw + 4), y1, bw, 20, fn[i], b -> filter(k)));
                  }
                  int tw = Math.max(60, W2 - 212);
                  TextFieldWidget tf = new TextFieldWidget(textRenderer, ax, y2, tw, 20, Text.literal("teks"));
                  tf.setMaxLength(80); tf.setPlaceholder(Text.literal("isi teks")); tf.setText(txt);
                  tf.setChangedListener(s -> txt = s);
                  addDrawableChild(tf);
                  addDrawableChild(new RoyalButton(ax + tw + 4, y2, 60, 20, "Teks", b -> addText()));
                  addDrawableChild(new RoyalButton(ax + tw + 68, y2, 70, 20, CN[ci], b -> { ci = (ci + 1) % COLORS.length; clearAndInit(); }));
                  addDrawableChild(new RoyalButton(ax + tw + 142, y2, 70, 20, "Sensor", b -> censor()));
                  int sw4 = (W2 - 12) / 4;
                  addDrawableChild(new RoyalSlider(ax, y3, sw4, 20, "X", sx, v -> sx = v));
                  addDrawableChild(new RoyalSlider(ax + (sw4 + 4), y3, sw4, 20, "Y", sy, v -> sy = v));
                  addDrawableChild(new RoyalSlider(ax + 2 * (sw4 + 4), y3, sw4, 20, "Lebar", sw, v -> sw = v));
                  addDrawableChild(new RoyalSlider(ax + 3 * (sw4 + 4), y3, sw4, 20, "Tinggi", sh, v -> sh = v));
                  addDrawableChild(new RoyalButton(14, y4, lw - 8, 20, "Kembali", b -> close()));
                  addDrawableChild(new RoyalButton(ax, y4, 100, 20, "Simpan", b -> save()));
                  addDrawableChild(new RoyalButton(ax + 104, y4, 80, 20, "Hapus", b -> delete()).style(RoyalButton.DANGER));
              }

              @Override public boolean mouseScrolled(double x, double y, double h, double v) {
                  scroll -= (int) Math.signum(v); clearAndInit(); return true;
              }

              private void load(Path p) {
                  try {
                      sel = p; orig = ImageIO.read(p.toFile());
                      cur = copy(orig); refresh(); msg = "";
                  } catch (Exception e) { msg = "Gagal membuka gambar"; }
              }
              private static BufferedImage copy(BufferedImage s) {
                  BufferedImage d = new BufferedImage(s.getWidth(), s.getHeight(), BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = d.createGraphics(); g.drawImage(s, 0, 0, null); g.dispose(); return d;
              }
              private void refresh() {
                  try { Assets.destroy(prev); prev = Assets.fromBuffered(cur); } catch (Exception e) { msg = "Gagal preview"; }
              }
              private void filter(int mode) {
                  if (cur == null) return;
                  if (mode == 5) { cur = copy(orig); refresh(); return; }
                  for (int y = 0; y < cur.getHeight(); y++) for (int x = 0; x < cur.getWidth(); x++) {
                      int p = cur.getRGB(x, y), a = p >>> 24, r = (p >> 16) & 255, g = (p >> 8) & 255, b = p & 255;
                      switch (mode) {
                          case 0 -> { int l = (int) (.299 * r + .587 * g + .114 * b); r = g = b = l; }
                          case 1 -> { int nr = Math.min(255, (int) (.393 * r + .769 * g + .189 * b));
                                      int ng = Math.min(255, (int) (.349 * r + .686 * g + .168 * b));
                                      int nb = Math.min(255, (int) (.272 * r + .534 * g + .131 * b)); r = nr; g = ng; b = nb; }
                          case 2 -> { r = 255 - r; g = 255 - g; b = 255 - b; }
                          case 3 -> { r = Math.min(255, r + 25); b = Math.max(0, b - 25); }
                          case 4 -> { b = Math.min(255, b + 25); r = Math.max(0, r - 25); }
                      }
                      cur.setRGB(x, y, (a << 24) | (r << 16) | (g << 8) | b);
                  }
                  refresh();
              }
              private void addText() {
                  if (cur == null || txt.isBlank()) return;
                  try {
                      Graphics2D g = cur.createGraphics();
                      g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                      g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING, RenderingHints.VALUE_TEXT_ANTIALIAS_ON);
                      int size = Math.max(12, (int) (sh * cur.getHeight()));
                      g.setFont(new Font(Font.SANS_SERIF, Font.BOLD, size));
                      int x = (int) (sx * cur.getWidth()), y = (int) (sy * cur.getHeight()) + size;
                      g.setColor(new Color(0, 0, 0, 180)); g.drawString(txt, x + 2, y + 2);
                      g.setColor(new Color(COLORS[ci])); g.drawString(txt, x, y);
                      g.dispose(); refresh();
                  } catch (Throwable t) { msg = "Font tidak tersedia di sistem ini"; }
              }
              private void censor() {
                  if (cur == null) return;
                  int W = cur.getWidth(), H = cur.getHeight();
                  int x1 = (int) (sx * W), y1 = (int) (sy * H);
                  int x2 = Math.min(W, x1 + Math.max(4, (int) (sw * W))), y2 = Math.min(H, y1 + Math.max(4, (int) (sh * H)));
                  int blk = Math.max(8, Math.min(W, H) / 40);
                  for (int by = y1; by < y2; by += blk) for (int bx = x1; bx < x2; bx += blk) {
                      int ex = Math.min(x2, bx + blk), ey = Math.min(y2, by + blk);
                      long a = 0, r = 0, g = 0, b = 0; int n = 0;
                      for (int y = by; y < ey; y++) for (int x = bx; x < ex; x++) {
                          int p = cur.getRGB(x, y); a += p >>> 24; r += (p >> 16) & 255; g += (p >> 8) & 255; b += p & 255; n++;
                      }
                      if (n == 0) continue;
                      int col = ((int) (a / n) << 24) | ((int) (r / n) << 16) | ((int) (g / n) << 8) | (int) (b / n);
                      for (int y = by; y < ey; y++) for (int x = bx; x < ex; x++) cur.setRGB(x, y, col);
                  }
                  refresh();
              }
              private void save() {
                  if (cur == null || sel == null) return;
                  try {
                      String n = sel.getFileName().toString().replaceAll("\\.png$", "");
                      File out = sel.getParent().resolve(n + "_edit" + (System.currentTimeMillis() % 100000) + ".png").toFile();
                      ImageIO.write(cur, "png", out);
                      msg = "Tersimpan: " + out.getName(); clearAndInit();
                  } catch (Exception e) { msg = "Gagal menyimpan"; }
              }
              private void delete() {
                  if (sel == null) return;
                  try { Files.deleteIfExists(sel); } catch (Exception ignored) {}
                  sel = null; cur = orig = null; Assets.destroy(prev); prev = null; msg = "Dihapus"; clearAndInit();
              }

              @Override public void render(DrawContext c, int mx, int my, float d) {
                  Theme.bg(c, width, height);
                  Theme.text(c, "Gallery  (" + files.size() + " screenshot, tekan F2 di game)", 14, 14, Theme.TEXT);
                  Theme.panel(c, 10, 36, 170, height - 36 - 34);
                  Theme.panel(c, ax, ay, aw, ah);
                  if (files.isEmpty()) Theme.text(c, "Belum ada screenshot", 18, 46, Theme.MUTED);
                  if (prev != null && cur != null) {
                      float sc = Math.min((aw - 8f) / cur.getWidth(), (ah - 8f) / cur.getHeight());
                      int dw = (int) (cur.getWidth() * sc), dh = (int) (cur.getHeight() * sc);
                      int x = ax + (aw - dw) / 2, y = ay + (ah - dh) / 2;
                      c.drawTexture(RenderPipelines.GUI_TEXTURED, prev.id(), x, y, 0f, 0f, dw, dh, prev.w(), prev.h(), prev.w(), prev.h());
                      int rx = x + (int) (sx * dw), ry = y + (int) (sy * dh);
                      int rw = Math.max(2, (int) (sw * dw)), rh = Math.max(2, (int) (sh * dh));
                      int col = 0xFFFF3B30;
                      c.fill(rx, ry, rx + rw, ry + 1, col); c.fill(rx, ry + rh, rx + rw, ry + rh + 1, col);
                      c.fill(rx, ry, rx + 1, ry + rh, col); c.fill(rx + rw, ry, rx + rw + 1, ry + rh + 1, col);
                  } else Theme.center(c, "Pilih screenshot di kiri", ax + aw / 2, ay + ah / 2, Theme.MUTED);
                  Theme.text(c, msg, ax + 190, height - 22, Theme.TEXT);
                  super.render(c, mx, my, d);
              }
          }
