          package com.charcoalui;
          import javazoom.jl.decoder.*;
          import javax.sound.sampled.*;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import java.util.concurrent.*;
          import java.util.stream.Stream;

          public final class MusicPlayer {
              public static final MusicPlayer I = new MusicPlayer();
              public volatile List<Track> all = new ArrayList<>();
              public volatile Map<String, List<Track>> playlists = new LinkedHashMap<>();
              public volatile List<Track> queue = new ArrayList<>();
              public volatile int qi = -1;
              public volatile Track current;
              public volatile float volume = 0.7f;
              public volatile boolean paused = false, shuffle = false;
              public volatile double playedMs = 0, totalMs = 0;
              private volatile int gen = 0;
              private final Random rnd = new Random();
              private final Map<Path, Track> cache = new HashMap<>();
              private final ExecutorService loader = Executors.newSingleThreadExecutor(r -> {
                  Thread t = new Thread(r, "charcoalui-meta"); t.setDaemon(true); return t;
              });

              private Track track(Path p) { return cache.computeIfAbsent(p, Track::new); }

              /** Root folder = Semua Lagu; tiap subfolder = playlist. */
              public void scan() {
                  Path root = Assets.dir("music");
                  List<Track> a = new ArrayList<>();
                  Map<String, List<Track>> pl = new LinkedHashMap<>();
                  for (Path p : Assets.list(root, ".mp3")) a.add(track(p));
                  try (Stream<Path> s = Files.list(root)) {
                      for (Path d : s.filter(Files::isDirectory).sorted().toList()) {
                          List<Track> l = new ArrayList<>();
                          for (Path p : Assets.list(d, ".mp3")) l.add(track(p));
                          if (!l.isEmpty()) { pl.put(d.getFileName().toString(), l); a.addAll(l); }
                      }
                  } catch (IOException ignored) {}
                  all = a; playlists = pl;
                  for (Track t : a) if (t.queued.compareAndSet(false, true)) loader.submit(() -> Id3.read(t));
              }

              public void play(List<Track> list, int i) {
                  queue = new ArrayList<>(list); start(i);
              }
              private void start(int i) {
                  List<Track> q = queue;
                  if (i < 0 || i >= q.size()) return;
                  final int g = ++gen;
                  qi = i; current = q.get(i); paused = false; playedMs = 0;
                  totalMs = Math.max(0, current.durMs);
                  final Track t = current;
                  Thread th = new Thread(() -> run(t, g), "charcoalui-music");
                  th.setDaemon(true); th.start();
              }
              public void toggle() {
                  if (current == null) { if (!all.isEmpty()) play(all, 0); }
                  else paused = !paused;
              }
              public void next() {
                  int n = queue.size(); if (n == 0) return;
                  start(shuffle ? rnd.nextInt(n) : (qi + 1) % n);
              }
              public void prev() {
                  int n = queue.size(); if (n == 0) return;
                  start(playedMs > 3000 ? Math.max(qi, 0) : (qi - 1 + n) % n);
              }

              private void run(Track t, int g) {
                  try (InputStream in = new BufferedInputStream(Files.newInputStream(t.path))) {
                      if (t.durMs <= 0) {
                          double tot = 0;
                          try (InputStream in2 = new BufferedInputStream(Files.newInputStream(t.path))) {
                              Bitstream b2 = new Bitstream(in2); Header h;
                              while ((h = b2.readFrame()) != null) { tot += h.ms_per_frame(); b2.closeFrame(); }
                          } catch (Exception ignored) {}
                          t.durMs = (long) tot;
                      }
                      if (g == gen) totalMs = t.durMs;
                      Bitstream bs = new Bitstream(in);
                      Decoder dec = new Decoder();
                      SourceDataLine line = null;
                      boolean natural = false;
                      try {
                          while (g == gen) {
                              if (paused) { Thread.sleep(50); continue; }
                              Header h = bs.readFrame();
                              if (h == null) { natural = true; break; }
                              SampleBuffer buf = (SampleBuffer) dec.decodeFrame(h, bs);
                              if (line == null) {
                                  AudioFormat f = new AudioFormat(dec.getOutputFrequency(), 16, dec.getOutputChannels(), true, false);
                                  line = AudioSystem.getSourceDataLine(f); line.open(f); line.start();
                              }
                              short[] s = buf.getBuffer(); int n = buf.getBufferLength();
                              byte[] out = new byte[n * 2]; float v = volume * volume;
                              for (int i = 0; i < n; i++) {
                                  int val = (int) (s[i] * v);
                                  out[2 * i] = (byte) val; out[2 * i + 1] = (byte) (val >> 8);
                              }
                              line.write(out, 0, out.length);
                              playedMs += h.ms_per_frame();
                              bs.closeFrame();
                          }
                      } finally {
                          if (line != null) { if (natural) line.drain(); else line.flush(); line.stop(); line.close(); }
                      }
                      if (natural && g == gen) next();
                  } catch (Throwable e) { if (g == gen) paused = true; }
              }
          }
