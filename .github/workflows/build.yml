                  String tot = fmt(mp.totalMs);
                  Theme.text(c, tot, bx + bw - textRenderer.getWidth(tot), byy + 6, Theme.MUTED);
                  super.render(c, mx, my, d);
              }
          }
          EOF

      # ---------------------------------------------------------------
      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: charcoalui-mod
          path: |
            build/libs/charcoalui-*.jar
            !build/libs/*-sources.jar
