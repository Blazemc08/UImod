# =====================================================================
#  CHARCOAL UI - Fabric 1.21.11 (client mod)
#  Taruh file ini di:  .github/workflows/build.yml  (di repo GitHub kosong)
#  Lalu: tab Actions -> "Build Charcoal UI" -> Run workflow -> download artifact (.jar)
#  Seluruh source code mod ditulis oleh workflow ini (step "Generate ...").
# =====================================================================
name: Build Charcoal UI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # Kalau Gradle bilang versi tidak ada, ganti di sini saja.
  MC_VERSION: "1.21.11"
  YARN: "1.21.11+build.3"
  LOADER: "0.18.2"
  FABRIC_API: "0.140.0+1.21.11"
  LOOM: "1.14-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      # ---------------------------------------------------------------
      - name: Generate Gradle config + metadata
        run: |
          mkdir -p src/main/java/com/charcoalui/mixin src/main/resources
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=$MC_VERSION
          yarn_mappings=$YARN
          loader_version=$LOADER
          fabric_version=$FABRIC_API
          loom_version=$LOOM
          EOF
          sed -i 's/^ *//' gradle.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'charcoalui'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'fabric-loom' version "${loom_version}" }
          version = '1.0.0'
          group = 'com.charcoalui'
          base { archivesName = 'charcoalui' }
          repositories { mavenCentral() }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              implementation 'javazoom:jlayer:1.0.1'
              include 'javazoom:jlayer:1.0.1'
          }
          processResources {
              inputs.property 'version', project.version
              filesMatching('fabric.mod.json') { expand 'version': project.version }
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          java { withSourcesJar() }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "charcoalui",
            "version": "${version}",
            "name": "Charcoal UI",
            "description": "Menu ala Essential, skin, cape, cosmetic, account switcher, gallery, music player.",
            "environment": "client",
            "entrypoints": { "client": ["com.charcoalui.CharcoalUI"] },
            "mixins": ["charcoalui.mixins.json"],
            "depends": { "fabricloader": ">=0.18.0", "minecraft": "~1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          EOF

          cat > src/main/resources/charcoalui.mixins.json <<'EOF'
          {
            "required": true,
            "package": "com.charcoalui.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": ["SessionAccessor"],
            "injectors": { "defaultRequire": 1 }
          }
          EOF

          cat > src/main/java/com/charcoalui/mixin/SessionAccessor.java <<'EOF'
          package com.charcoalui.mixin;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.session.Session;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Mutable;
          import org.spongepowered.asm.mixin.gen.Accessor;
          @Mixin(MinecraftClient.class)
          public interface SessionAccessor {
              @Accessor("session") @Mutable void charcoal$setSession(Session session);
          }
          EOF

      # ---------------------------------------------------------------
      - name: Generate core (entry, theme, assets, accounts, widgets)
        run: |
          D=src/main/java/com/charcoalui

          cat > $D/CharcoalUI.java <<'EOF'
          package com.charcoalui;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.screen.GameMenuScreen;

          public class CharcoalUI implements ClientModInitializer {
              public static boolean allowVanilla = false;
              @Override public void onInitializeClient() {
                  System.setProperty("java.awt.headless", "true");
                  Assets.init();
                  Accounts.load();
                  ClientLifecycleEvents.CLIENT_STARTED.register(c -> Accounts.applyCurrent());
                  ClientTickEvents.END_CLIENT_TICK.register(c -> {
                      Screen s = c.currentScreen;
                      if (s instanceof TitleScreen) c.setScreen(new MenuScreen(false));
                      else if (s instanceof GameMenuScreen && !allowVanilla && c.world != null) c.setScreen(new MenuScreen(true));
                      if (!(s instanceof GameMenuScreen)) allowVanilla = false;
                  });
              }
          }
          EOF

          cat > $D/Theme.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          public final class Theme {
              public static final int BG = 0xFF2B2B2D, PANEL = 0xFF343437, PANEL_LIGHT = 0xFF3F3F44;
              public static final int BLUE = 0xFF4169E1, BLUE_HOVER = 0xFF5B7FEA, DANGER = 0xFFC0392B;
              public static final int TEXT = 0xFFEDEDED, MUTED = 0xFF9A9AA0;
              public static void bg(DrawContext c, int w, int h) { c.fill(0, 0, w, h, BG); }
              public static void round(DrawContext c, int x, int y, int w, int h, int col) {
                  c.fill(x + 2, y, x + w - 2, y + h, col);
                  c.fill(x + 1, y + 1, x + w - 1, y + h - 1, col);
                  c.fill(x, y + 2, x + w, y + h - 2, col);
              }
              public static void panel(DrawContext c, int x, int y, int w, int h) { round(c, x, y, w, h, PANEL); }
              public static void text(DrawContext c, String s, int x, int y, int col) {
                  c.drawText(MinecraftClient.getInstance().textRenderer, s, x, y, col, false);
              }
              public static void center(DrawContext c, String s, int cx, int y, int col) {
                  int w = MinecraftClient.getInstance().textRenderer.getWidth(s);
                  text(c, s, cx - w / 2, y, col);
              }
          }
          EOF

          cat > $D/RoyalButton.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          public class RoyalButton extends ButtonWidget {
              public static final int ROYAL = 0, ROW = 1, DANGER = 2, GALLERY = 3;
              private int style; private boolean selected, left;
              public RoyalButton(int x, int y, int w, int h, String label, PressAction a) {
                  super(x, y, w, h, Text.literal(label), a, DEFAULT_NARRATION_SUPPLIER);
              }
              public RoyalButton style(int s) { style = s; return this; }
              public RoyalButton select(boolean s) { selected = s; return this; }
              public RoyalButton left(boolean l) { left = l; return this; }
              @Override public void renderWidget(DrawContext c, int mx, int my, float d) {
                  boolean hv = isHovered();
                  int bg;
                  if (style == ROW) bg = selected ? 0xFF3A4A7A : (hv ? 0xFF404046 : 0x00000000);
                  else if (style == DANGER) bg = hv ? 0xFFD64B3B : Theme.DANGER;
                  else bg = !active ? 0xFF55596A : (hv ? Theme.BLUE_HOVER : Theme.BLUE);
                  int x = getX(), y = getY(), w = getWidth(), h = getHeight();
                  Theme.round(c, x, y, w, h, bg);
                  if (style == GALLERY) {
                      int W = 0xFFFFFFFF;
                      c.fill(x + 5, y + 6, x + w - 5, y + h - 6, W);
                      c.fill(x + 6, y + 7, x + w - 6, y + h - 7, bg);
                      c.fill(x + w - 10, y + 8, x + w - 8, y + 10, W);
                      c.fill(x + 7, y + h - 9, x + 14, y + h - 7, W);
                      c.fill(x + 9, y + h - 11, x + 12, y + h - 9, W);
                      return;
                  }
                  TextRenderer tr = MinecraftClient.getInstance().textRenderer;
                  String s = getMessage().getString();
                  int ty = y + (h - 8) / 2;
                  int col = (style == ROW && !selected) ? 0xFFD0D0D6 : 0xFFFFFFFF;
                  if (left) c.drawText(tr, s, x + 6, ty, col, false);
                  else c.drawText(tr, s, x + (w - tr.getWidth(s)) / 2, ty, col, false);
              }
          }
          EOF

          cat > $D/RoyalSlider.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.text.Text;
          import java.util.function.DoubleConsumer;
          public class RoyalSlider extends SliderWidget {
              private final String label; private final DoubleConsumer cb;
              public RoyalSlider(int x, int y, int w, int h, String label, double v, DoubleConsumer cb) {
                  super(x, y, w, h, Text.literal(""), v);
                  this.label = label; this.cb = cb; updateMessage();
              }
              @Override protected void updateMessage() {
                  if (label != null) setMessage(Text.literal(label + " " + (int) Math.round(value * 100) + "%"));
              }
              @Override protected void applyValue() { if (cb != null) cb.accept(value); }
              @Override public void renderWidget(DrawContext c, int mx, int my, float d) {
                  int x = getX(), y = getY(), w = getWidth(), h = getHeight();
                  c.fill(x, y, x + w, y + h, 0xFF1F1F22);
                  c.fill(x, y, x + (int) (w * value), y + h, isHovered() ? Theme.BLUE_HOVER : Theme.BLUE);
                  Theme.center(c, getMessage().getString(), x + w / 2, y + (h - 8) / 2, 0xFFFFFFFF);
              }
          }
          EOF

          cat > $D/Assets.java <<'EOF'
          package com.charcoalui;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.texture.NativeImage;
          import net.minecraft.client.texture.NativeImageBackedTexture;
          import net.minecraft.util.Identifier;
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;
          import java.util.stream.*;
          public final class Assets {
              public record Tex(Identifier id, int w, int h) {}
              private static final Map<String, Tex> CACHE = new HashMap<>();
              private static final Set<String> FAIL = new HashSet<>();
              private static int counter = 0;
              public static Path root() { return FabricLoader.getInstance().getGameDir().resolve("charcoalui"); }
              public static Path dir(String n) {
                  Path p = root().resolve(n);
                  try { Files.createDirectories(p); } catch (IOException ignored) {}
                  return p;
              }
              public static void init() { for (String s : new String[]{"skins", "capes", "cosmetics", "music"}) dir(s); }
              public static List<Path> list(Path dir, String... ext) {
                  try (Stream<Path> s = Files.list(dir)) {
                      return s.filter(Files::isRegularFile).filter(p -> {
                          String n = p.getFileName().toString().toLowerCase();
                          for (String e : ext) if (n.endsWith(e)) return true;
                          return false;
                      }).sorted(Comparator.comparing(p -> p.getFileName().toString().toLowerCase()))
                        .collect(Collectors.toCollection(ArrayList::new));
                  } catch (IOException e) { return new ArrayList<>(); }
              }
              public static Tex texture(Path p) {
                  String key = p + "#" + p.toFile().lastModified();
                  Tex t = CACHE.get(key);
                  if (t != null) return t;
                  if (FAIL.contains(key)) return null;
                  try (InputStream in = Files.newInputStream(p)) {
                      t = register(NativeImage.read(in));
                      CACHE.put(key, t);
                      return t;
                  } catch (Exception e) { FAIL.add(key); return null; }
              }
              public static Tex register(NativeImage img) {
                  int w = img.getWidth(), h = img.getHeight();
                  Identifier id = Identifier.of("charcoalui", "tex/" + (counter++));
                  MinecraftClient.getInstance().getTextureManager()
                      .registerTexture(id, new NativeImageBackedTexture(() -> id.toString(), img));
                  return new Tex(id, w, h);
              }
              public static Tex fromBuffered(BufferedImage b) throws IOException {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  ImageIO.write(b, "png", o);
                  return register(NativeImage.read(new ByteArrayInputStream(o.toByteArray())));
              }
              public static void destroy(Tex t) {
                  if (t != null) MinecraftClient.getInstance().getTextureManager().destroyTexture(t.id());
              }
          }
          EOF

          cat > $D/Selection.java <<'EOF'
          package com.charcoalui;
          import java.io.*;
          import java.nio.file.*;
          import java.util.Properties;
          public final class Selection {
              private static final Properties P = new Properties();
              private static Path file() { return Assets.root().resolve("selection.properties"); }
              static {
                  try (InputStream in = Files.newInputStream(file())) { P.load(in); } catch (Exception ignored) {}
              }
              public static void set(String k, String v) {
                  if (v == null) P.remove(k); else P.setProperty(k, v);
                  try (OutputStream o = Files.newOutputStream(file())) { P.store(o, "charcoalui"); } catch (Exception ignored) {}
              }
              public static Path path(String k, String dir) {
                  String n = P.getProperty(k);
                  if (n == null) return null;
                  Path p = Assets.dir(dir).resolve(n);
                  return Files.exists(p) ? p : null;
              }
          }
          EOF

          cat > $D/Accounts.java <<'EOF'
          package com.charcoalui;
          import com.charcoalui.mixin.SessionAccessor;
          import com.google.gson.*;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.session.Session;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.*;
          import java.util.*;
          public final class Accounts {
              public static final int MAX = 200;
              public static final List<String> NAMES = new ArrayList<>();
              public static String current;
              private static Path file() { return Assets.root().resolve("accounts.json"); }
              public static void load() {
                  try {
                      if (!Files.exists(file())) return;
                      JsonObject o = JsonParser.parseString(Files.readString(file())).getAsJsonObject();
                      for (JsonElement e : o.getAsJsonArray("accounts")) NAMES.add(e.getAsString());
                      if (o.has("current")) current = o.get("current").getAsString();
                  } catch (Exception ignored) {}
              }
              public static void save() {
                  try {
                      JsonObject o = new JsonObject();
                      JsonArray a = new JsonArray();
                      for (String n : NAMES) a.add(n);
                      o.add("accounts", a);
                      if (current != null) o.addProperty("current", current);
                      Files.writeString(file(), new GsonBuilder().setPrettyPrinting().create().toJson(o));
                  } catch (Exception ignored) {}
              }
              public static void applyCurrent() {
                  String real = MinecraftClient.getInstance().getSession().getUsername();
                  if (NAMES.isEmpty()) { NAMES.add(real); current = real; save(); }
                  else if (current != null && NAMES.contains(current)) switchTo(current);
                  else { current = real; if (!NAMES.contains(real) && NAMES.size() < MAX) NAMES.add(real); save(); }
              }
              public static UUID offlineUuid(String n) {
                  return UUID.nameUUIDFromBytes(("OfflinePlayer:" + n).getBytes(StandardCharsets.UTF_8));
              }
              public static void switchTo(String n) {
                  MinecraftClient c = MinecraftClient.getInstance();
                  Session s = new Session(n, offlineUuid(n), "0", Optional.empty(), Optional.empty());
                  ((SessionAccessor) (Object) c).charcoal$setSession(s);
                  current = n; save();
              }
              private static String check(String n) {
                  if (n == null || !n.matches("[A-Za-z0-9_]{3,16}")) return "Username: 3-16 karakter (huruf/angka/_)";
                  for (String x : NAMES) if (x.equalsIgnoreCase(n)) return "Username sudah ada";
                  return null;
              }
              public static String add(String n) {
                  if (NAMES.size() >= MAX) return "Batas " + MAX + " akun tercapai";
                  String e = check(n); if (e != null) return e;
                  NAMES.add(n); save(); return null;
              }
              public static String rename(String old, String n) {
                  int i = NAMES.indexOf(old);
                  if (i < 0) return "Pilih akun dulu";
                  String e = check(n); if (e != null) return e;
                  NAMES.set(i, n);
                  boolean wasCurrent = old.equals(current);
                  save();
                  if (wasCurrent) switchTo(n);
                  return null;
              }
              public static void remove(String n) {
                  NAMES.remove(n);
                  if (n.equals(current)) {
                      if (!NAMES.isEmpty()) switchTo(NAMES.get(0)); else { current = null; save(); }
                  } else save();
              }
          }
          EOF

          cat > $D/BBModel.java <<'EOF'
          package com.charcoalui;
          import com.google.gson.*;
          import net.minecraft.client.gui.DrawContext;
          import java.io.Reader;
          import java.nio.file.*;
          import java.util.*;
          public final class BBModel {
              public String name = "";
              public final List<float[]> cubes = new ArrayList<>();
              public static BBModel load(Path p) {
                  try (Reader r = Files.newBufferedReader(p)) {
                      JsonObject o = JsonParser.parseReader(r).getAsJsonObject();
                      BBModel m = new BBModel();
                      m.name = o.has("name") ? o.get("name").getAsString() : p.getFileName().toString();
                      if (o.has("elements")) for (JsonElement e : o.getAsJsonArray("elements")) {
                          JsonObject c = e.getAsJsonObject();
                          if (c.has("type") && !c.get("type").getAsString().equals("cube")) continue;
                          if (!c.has("from") || !c.has("to")) continue;
                          JsonArray f = c.getAsJsonArray("from"), t = c.getAsJsonArray("to");
                          m.cubes.add(new float[]{f.get(0).getAsFloat(), f.get(1).getAsFloat(), f.get(2).getAsFloat(),
                                                  t.get(0).getAsFloat(), t.get(1).getAsFloat(), t.get(2).getAsFloat()});
                      }
                      m.cubes.sort(Comparator.comparingDouble(a -> a[2]));
                      return m;
                  } catch (Exception ex) { return null; }
              }
              /** Proyeksi depan (flat). Render 3D di dunia belum termasuk. */
              public void draw(DrawContext c, int cx, int bottom, float s) {
                  int i = 0;
                  for (float[] a : cubes) {
                      int x1 = cx + Math.round(Math.min(a[0], a[3]) * s), x2 = cx + Math.round(Math.max(a[0], a[3]) * s);
                      int y1 = bottom - Math.round(Math.max(a[1], a[4]) * s), y2 = bottom - Math.round(Math.min(a[1], a[4]) * s);
                      int sh = 120 + (i * 37) % 100;
                      c.fill(x1, y1, x2, y2, 0xFF000000 | (sh / 2 << 16) | (sh * 2 / 3 << 8) | Math.min(255, sh + 60));
                      c.fill(x1, y1, x2, y1 + 1, 0x55FFFFFF);
                      i++;
                  }
              }
          }
          EOF

          cat > $D/Preview.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.gl.RenderPipelines;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.util.Identifier;
          public final class Preview {
              public static Assets.Tex steve() {
                  return new Assets.Tex(Identifier.ofVanilla("textures/entity/player/wide/steve.png"), 64, 64);
              }
              public static Assets.Tex currentSkin() {
                  java.nio.file.Path p = Selection.path("skin", "skins");
                  Assets.Tex t = p == null ? null : Assets.texture(p);
                  return t != null ? t : steve();
              }
              private static void part(DrawContext c, Assets.Tex t, int x, int y, int u, int v, int w, int h, int s) {
                  float f = t.w() / 64f;
                  c.drawTexture(RenderPipelines.GUI_TEXTURED, t.id(), x, y, u * f, v * f, w * s, h * s,
                          (int) (w * f), (int) (h * f), t.w(), t.h());
              }
              /** Tampak depan skin (2D). */
              public static void skin(DrawContext c, Assets.Tex t, int cx, int top, int s) {
                  boolean modern = t.h() >= t.w();
                  part(c, t, cx - 4 * s, top, 8, 8, 8, 8, s);
                  part(c, t, cx - 4 * s, top + 8 * s, 20, 20, 8, 12, s);
                  part(c, t, cx - 8 * s, top + 8 * s, 44, 20, 4, 12, s);
                  part(c, t, cx + 4 * s, top + 8 * s, modern ? 36 : 44, modern ? 52 : 20, 4, 12, s);
                  part(c, t, cx - 4 * s, top + 20 * s, 4, 20, 4, 12, s);
                  part(c, t, cx, top + 20 * s, modern ? 20 : 4, modern ? 52 : 20, 4, 12, s);
                  if (modern) {
                      part(c, t, cx - 4 * s, top, 40, 8, 8, 8, s);
                      part(c, t, cx - 4 * s, top + 8 * s, 20, 36, 8, 12, s);
                      part(c, t, cx - 8 * s, top + 8 * s, 44, 36, 4, 12, s);
                      part(c, t, cx + 4 * s, top + 8 * s, 52, 52, 4, 12, s);
                      part(c, t, cx - 4 * s, top + 20 * s, 4, 36, 4, 12, s);
                      part(c, t, cx, top + 20 * s, 4, 52, 4, 12, s);
                  }
              }
              public static void cape(DrawContext c, Assets.Tex t, int x, int y, int s) {
                  float f = t.w() / 64f;
                  c.drawTexture(RenderPipelines.GUI_TEXTURED, t.id(), x, y, f, f, 10 * s, 16 * s,
                          (int) (10 * f), (int) (16 * f), t.w(), t.h());
              }
          }
          EOF

      # ---------------------------------------------------------------
      - name: Generate screens (menu, skin/cape/cosmetic, accounts)
        run: |
          D=src/main/java/com/charcoalui

          cat > $D/MenuScreen.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.multiplayer.MultiplayerScreen;
          import net.minecraft.client.gui.screen.option.OptionsScreen;
          import net.minecraft.client.gui.screen.world.SelectWorldScreen;
          import net.minecraft.text.Text;

          public class MenuScreen extends Screen {
              private final boolean pause;
              public MenuScreen(boolean pause) { super(Text.literal("Charcoal UI")); this.pause = pause; }
              @Override public boolean shouldPause() { return pause; }
              @Override public boolean shouldCloseOnEsc() { return pause; }
              @Override public void renderBackground(DrawContext c, int mx, int my, float d) {}

              private int px = 16, pw = 150;

              @Override protected void init() {
                  String who = Accounts.current != null ? Accounts.current : client.getSession().getUsername();
                  addDrawableChild(new RoyalButton(px + 8, 24, pw - 16, 20, who + " (v)", b -> client.setScreen(new AccountScreen(this))));
                  addDrawableChild(new RoyalButton(px + 8, height - 44, pw - 16, 20, "Skin", b -> client.setScreen(new AssetScreen.Skin(this))));

                  int bw = 200, bh = 24, gap = 6;
                  int left = (width + pw) / 2 - bw / 2 - 40;
                  int n = pause ? 3 : 4;
                  int top = height / 2 - (n * (bh + gap)) / 2 + 14;
                  String[] names = pause ? new String[]{"Kembali ke Game", "Options", "Simpan / Keluar..."}
                                         : new String[]{"Singleplayer", "Multiplayer", "Options", "Keluar"};
                  for (int i = 0; i < n; i++) {
                      final int k = i;
                      addDrawableChild(new RoyalButton(left, top + i * (bh + gap), bw, bh, names[i], b -> action(k)));
                  }
                  int cx = left + bw + 8;
                  addDrawableChild(new RoyalButton(cx, top, 90, bh, "Cape", b -> client.setScreen(new AssetScreen.Cape(this))));
                  addDrawableChild(new RoyalButton(cx, top + bh + gap, 90, bh, "Cosmetic", b -> client.setScreen(new AssetScreen.Cosmetic(this))));

