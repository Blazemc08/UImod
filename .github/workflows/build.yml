          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.util.Arrays;

          /** Pembaca tag ID3 (judul, artis, cover) + estimasi durasi. Jalan di background thread. */
          public final class Id3 {
              private static final Charset ISO = StandardCharsets.ISO_8859_1;
              private static int u(byte b) { return b & 255; }
              private static int synch(byte[] d, int o) { return (u(d[o]) << 21) | (u(d[o + 1]) << 14) | (u(d[o + 2]) << 7) | u(d[o + 3]); }
              private static int plain(byte[] d, int o) { return (u(d[o]) << 24) | (u(d[o + 1]) << 16) | (u(d[o + 2]) << 8) | u(d[o + 3]); }

              public static void read(Track t) {
                  String title = null, artist = null; byte[] pic = null; long tagSize = 0;
                  try (InputStream in = Files.newInputStream(t.path)) {
                      byte[] h = in.readNBytes(10);
                      if (h.length == 10 && h[0] == 'I' && h[1] == 'D' && h[2] == '3') {
                          int ver = u(h[3]), flags = u(h[5]), size = synch(h, 6);
                          tagSize = size + 10L;
                          if (size > 0 && size <= 24_000_000) {
                              byte[] d = in.readNBytes(size);
                              String[] out = new String[2]; byte[][] pc = new byte[1][];
                              parse(d, ver, flags, out, pc);
                              title = out[0]; artist = out[1]; pic = pc[0];
                          }
                      }
                  } catch (Exception ignored) {}
                  if (title == null || title.isBlank()) {
                      try (RandomAccessFile f = new RandomAccessFile(t.path.toFile(), "r")) {
                          if (f.length() > 128) {
                              f.seek(f.length() - 128);
                              byte[] b = new byte[128]; f.readFully(b);
                              if (b[0] == 'T' && b[1] == 'A' && b[2] == 'G') {
                                  title = new String(b, 3, 30, ISO).replace('\0', ' ').trim();
                                  if (artist == null || artist.isBlank()) artist = new String(b, 33, 30, ISO).replace('\0', ' ').trim();
                              }
                          }
                      } catch (Exception ignored) {}
                  }
                  if (title != null && !title.isBlank()) t.title = title.trim();
                  if (artist != null && !artist.isBlank()) t.artist = artist.trim();
                  if (pic != null) t.coverPng = thumb(pic);
                  try (InputStream in = new BufferedInputStream(Files.newInputStream(t.path))) {
                      Bitstream bs = new Bitstream(in);
                      Header hd = bs.readFrame();
                      if (hd != null) {
                          long size = Math.max(1, Math.min(Integer.MAX_VALUE, Files.size(t.path) - tagSize));
                          float ms = hd.total_ms((int) size);
                          if (ms > 0) t.durMs = (long) ms;
                      }
                  } catch (Throwable ignored) {}
                  t.loaded = true;
              }

              private static void parse(byte[] d, int ver, int flags, String[] out, byte[][] pc) {
                  int pos = 0;
                  if (ver >= 3 && (flags & 0x40) != 0 && d.length >= 4) {
                      int es = ver == 4 ? synch(d, 0) : plain(d, 0) + 4;
                      pos = Math.max(0, Math.min(es, d.length));
                  }
                  int hl = ver == 2 ? 6 : 10;
                  while (pos + hl <= d.length) {
                      String id; int size;
                      if (ver == 2) { id = new String(d, pos, 3, ISO); size = (u(d[pos + 3]) << 16) | (u(d[pos + 4]) << 8) | u(d[pos + 5]); }
                      else { id = new String(d, pos, 4, ISO); size = ver == 4 ? synch(d, pos + 4) : plain(d, pos + 4); }
                      if (id.charAt(0) == 0 || size <= 0) break;
                      int start = pos + hl;
                      if (start + size > d.length) break;
                      if (id.equals("TIT2") || id.equals("TT2")) out[0] = text(d, start, size);
                      else if (id.equals("TPE1") || id.equals("TP1")) out[1] = text(d, start, size);
                      else if ((id.equals("APIC") || id.equals("PIC")) && pc[0] == null) pc[0] = apic(d, start, size, ver == 2);
                      pos = start + size;
                  }
              }
              private static String text(byte[] d, int off, int len) {
                  if (len < 2) return null;
                  int enc = u(d[off]);
                  Charset cs = enc == 0 ? ISO : enc == 1 ? StandardCharsets.UTF_16 : enc == 2 ? StandardCharsets.UTF_16BE : StandardCharsets.UTF_8;
                  String s = new String(d, off + 1, len - 1, cs);
                  int z = s.indexOf('\0'); if (z >= 0) s = s.substring(0, z);
                  return s.trim();
              }
              private static byte[] apic(byte[] d, int off, int len, boolean v22) {
                  int end = off + len, enc = u(d[off]), p = off + 1;
                  if (v22) p += 3; else { while (p < end && d[p] != 0) p++; p++; }
                  p++; // picture type
                  if (enc == 1 || enc == 2) { while (p + 1 < end && !(d[p] == 0 && d[p + 1] == 0)) p += 2; p += 2; }
                  else { while (p < end && d[p] != 0) p++; p++; }
                  if (p >= end) return null;
                  return Arrays.copyOfRange(d, p, end);
              }
              private static byte[] thumb(byte[] img) {
                  try {
                      BufferedImage b = ImageIO.read(new ByteArrayInputStream(img));
                      if (b == null) return null;
                      double sc = Math.min(1.0, 160.0 / Math.max(b.getWidth(), b.getHeight()));
                      int w = Math.max(1, (int) (b.getWidth() * sc)), h = Math.max(1, (int) (b.getHeight() * sc));
                      BufferedImage o = new BufferedImage(w, h, BufferedImage.TYPE_INT_ARGB);
                      Graphics2D g = o.createGraphics();
                      g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BILINEAR);
                      g.drawImage(b, 0, 0, w, h, null); g.dispose();
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      ImageIO.write(o, "png", bo);
                      return bo.toByteArray();
                  } catch (Throwable e) { return null; }
              }
          }
