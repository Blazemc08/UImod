          cat > $D/Track.java <<'EOF'
          package com.charcoalui;
          import net.minecraft.client.texture.NativeImage;
          import java.io.ByteArrayInputStream;
          import java.nio.file.Path;
          import java.util.concurrent.atomic.AtomicBoolean;
          public final class Track {
              public final Path path;
              public volatile String title, artist = "";
              public volatile long durMs = -1;
              public volatile byte[] coverPng;
              public volatile boolean loaded;
              public final AtomicBoolean queued = new AtomicBoolean(false);
              private Assets.Tex tex; private boolean texTried;
              public Track(Path p) {
                  path = p;
                  String n = p.getFileName().toString().replaceAll("(?i)\\.mp3$", "");
                  int i = n.indexOf(" - ");
                  if (i > 0) { artist = n.substring(0, i).trim(); title = n.substring(i + 3).trim(); } else title = n;
              }
              /** Panggil hanya dari render thread. */
              public Assets.Tex cover() {
                  byte[] b = coverPng;
                  if (tex == null && !texTried && b != null) {
                      texTried = true;
                      try { tex = Assets.register(NativeImage.read(new ByteArrayInputStream(b))); } catch (Exception ignored) {}
                  }
                  return tex;
              }
              public String dur() {
                  if (durMs <= 0) return "--:--";
                  long s = durMs / 1000;
                  return (s / 60) + ":" + String.format("%02d", s % 60);
              }
          }
          EOF

